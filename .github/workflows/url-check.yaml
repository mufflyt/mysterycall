on:
  pull_request:
    branches: [main]
  schedule:
    # Weekly. Link rot is a slow process and external hosts rate-limit, so a
    # scheduled sweep is a better fit than gating every push to main.
    - cron: "0 6 * * 1"
  workflow_dispatch:

name: url-check

permissions:
  contents: read

concurrency:
  group: url-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  url-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # urlchecker reads Rmd vignettes through pandoc; without it url_check()
      # aborts before checking a single URL.
      - uses: r-lib/actions/setup-pandoc@v2

      # knitr is the package's VignetteBuilder. urlchecker refuses to scan
      # vignettes without it, so it is a hard requirement here, not optional.
      - name: Install urlchecker
        run: install.packages(c("urlchecker", "knitr"))
        shell: Rscript {0}

      # Checks URLs in DESCRIPTION, README.md, NEWS.md, man/ and vignettes/ --
      # the same set CRAN flags on submission.
      #
      # Findings are advisory: urlchecker reports 403s and timeouts from hosts
      # that rate-limit CI runners, and those are not real broken links, so a
      # human judges them from the annotation.
      #
      # Deliberately NOT continue-on-error at the step level. That would also
      # swallow setup failures and report green having checked nothing, which
      # is exactly what a missing pandoc did on the first run of this workflow.
      # Only the findings are downgraded, inside the tryCatch below; anything
      # that stops url_check() from running at all still fails the job.
      - name: Check URLs
        run: |
          res <- tryCatch(
            urlchecker::url_check("."),
            error = function(e) {
              cat("::error::urlchecker could not run: ", conditionMessage(e), "\n", sep = "")
              quit(status = 1L)
            }
          )
          print(res)
          n <- NROW(res)
          if (n > 0) {
            cat("::warning::urlchecker reported ", n, " URL(s) needing review\n", sep = "")
          } else {
            cat("All URLs OK\n")
          }
        shell: Rscript {0}
