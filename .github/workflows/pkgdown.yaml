# Build and deploy pkgdown site to GitHub Pages
# Runs on push to main, PRs (build only), releases, and manual dispatch.
# Reference: https://github.com/r-lib/actions/tree/v2/examples#pkgdown
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: write

concurrency:
  # PRs get their own group so each PR build is independent.
  # All non-PR runs share one group so rapid pushes cancel the previous run.
  group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
  cancel-in-progress: true

jobs:
  pkgdown:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Set CENSUS_API_KEY if you have Census ACS vignettes that execute.
      # CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libgit2-dev libgdal-dev libgeos-dev libproj-dev \
            libudunits2-dev libfftw3-dev libtiff5-dev \
            libjpeg-dev libpng-dev qpdf

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::xml2, local::.
          needs: website
          cache: true
          cache-version: 2

      # Retries ONLY on a segfault. pkgdown crashes intermittently inside xml2
      # (exit 139 / SIGSEGV, "invalid permissions" or "recursive gc invocation")
      # during build_home_index() or build_reference_index(); the same commit
      # then builds cleanly on a re-run. Measured at roughly 1 run in 5.
      #
      # Any other non-zero exit is a real failure and fails the job immediately,
      # without burning retries. That distinction matters: a genuine breakage
      # here, such as topics missing from the _pkgdown.yml reference index,
      # exits 1 and must stay loud. Blanket retries -- or continue-on-error --
      # would turn this gate into one that cannot fail.
      - name: Build pkgdown site
        shell: bash
        run: |
          attempts=3
          for attempt in $(seq 1 $attempts); do
            code=0
            Rscript -e 'pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)' || code=$?

            if [ "$code" -eq 0 ]; then
              [ "$attempt" -gt 1 ] && echo "::notice::pkgdown build succeeded on attempt $attempt"
              exit 0
            fi

            if [ "$code" -ne 139 ]; then
              echo "::error::pkgdown build failed with exit $code. Not a segfault, so this is a real failure and is not retried."
              exit "$code"
            fi

            echo "::warning::pkgdown segfaulted (exit 139) on attempt $attempt of $attempts."
            # A crashed run can leave a half-written docs/; start each retry clean.
            rm -rf docs
            sleep 5
          done

          echo "::error::pkgdown segfaulted on all $attempts attempts. Likely more than transient flakiness -- investigate."
          exit 139

      - name: Add .nojekyll to prevent Jekyll processing
        run: touch docs/.nojekyll

      - name: Deploy to GitHub Pages
        # Only deploy on pushes to main and releases — not on PRs.
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.6.8
        with:
          branch: gh-pages
          folder: docs
          clean: true
