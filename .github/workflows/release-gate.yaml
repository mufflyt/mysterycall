name: release-gate

# A release must be able to prove that the COMPLETE adversarial campaign passed
# against the exact tree being shipped.
#
# The hole this closes:
#
#     commit A -> full mutation campaign passes
#     commit B -> ordinary CI passes
#     release B
#
# B never faced the campaign. Every badge is green, nothing is false, and the
# release was never subjected to the adversarial layer at all. Nightly proves a
# commit; it does not prove THIS commit. So the campaign is re-run here, on the
# release SHA, and the receipt is verified against this tree rather than trusted.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  # Backstop: if a release is published without the tag path having run, fail
  # loudly rather than leaving the gate silently unexercised.
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-mutation-gate:
    name: complete campaign against the release SHA
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::testthat, any::jsonlite, any::digest
          needs: check
          cache-version: 3

      # The FULL campaign, not the sentinel tier. GITHUB_SHA is stamped into the
      # receipt, so the verification below is binding rather than ceremonial.
      - name: Run the complete scientific mutation campaign
        run: Rscript .github/scripts/check-scientific-mutations.R

      - name: Prove it ran, the control passed, and every poison failed
        if: always()
        run: Rscript .github/scripts/verify-mutation-receipt.R

      # Refuses a sentinel receipt, a receipt minted for another commit, and a
      # receipt whose test inventory or fixture no longer match this tree.
      - name: Release gate -- receipt must certify THIS tree
        if: always()
        run: Rscript .github/scripts/verify-release-mutation-receipt.R

      - name: Upload the release mutation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-mutation-receipt
          path: mutation-receipt.json
          if-no-files-found: error
