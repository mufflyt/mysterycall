on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: repo-hygiene

permissions:
  contents: read

concurrency:
  group: repo-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # ls-files only needs the working tree, but a full checkout keeps the
          # script usable if it ever needs history.
          fetch-depth: 1

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          use-public-rspm: true

      # Only jsonlite is needed (codemeta.json). Installed directly rather than
      # via setup-r-dependencies so this gate stays fast and does not depend on
      # the package's own Imports resolving.
      - name: Install jsonlite
        run: install.packages("jsonlite")
        shell: Rscript {0}

      - name: Check repo hygiene
        run: Rscript .github/scripts/check-repo-hygiene.R

      # pkgdown enforces this too, but only after a ~15 minute site build.
      # Catching it here turns that into a one-second failure.
      - name: Check every documented topic is in the pkgdown index
        run: Rscript .github/scripts/check-pkgdown-index.R
