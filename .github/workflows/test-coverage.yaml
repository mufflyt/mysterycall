on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: test-coverage

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage
          cache-version: 2
      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          covr::to_cobertura(cov)
        shell: Rscript {0}
      - name: Show test failures
        if: failure()
        run: |
          fail_files <- Sys.glob(file.path(
            normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"),
            "package/mysterycall/mysterycall-tests/testthat.Rout.fail"
          ))
          if (length(fail_files) == 0) {
            fail_files <- Sys.glob(file.path(
              normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"),
              "package/*/*-tests/testthat.Rout.fail"
            ))
          }
          for (f in fail_files) {
            if (file.exists(f)) {
              cat("── Failures from", f, "──\n")
              lines <- readLines(f, warn = FALSE)
              # Print last 200 lines to capture failure block without drowning in R startup noise
              cat(tail(lines, 200), sep = "\n")
            }
          }
        shell: Rscript {0}
      - name: Print coverage summary
        run: |
          if (file.exists("cobertura.xml")) {
            xml <- xml2::read_xml("cobertura.xml")
            pct <- as.numeric(xml2::xml_attr(xml, "line-rate")) * 100
            cat(sprintf("Coverage: %.1f%%\n", pct))
          }
        shell: Rscript {0}
      - uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: false
          files: ./cobertura.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: mufflyt/mysterycall
