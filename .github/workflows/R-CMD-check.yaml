# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

concurrency:
  # A new push to the same branch/PR cancels the in-progress run so checks
  # don't pile up (matters most for the full matrix on main).
  group: R-CMD-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pick the matrix by event: a pull request gets a fast single-platform gate
  # (ubuntu-release); push(main) and manual workflow_dispatch runs get the full
  # cross-platform matrix (macOS, Windows, Linux release/oldrel-1).
  #
  # R-devel is deliberately NOT here. RSPM ships binaries built for released R,
  # so on R-devel pak compiles all 57 Suggests from source, which does not fit
  # in this workflow's 60-minute budget: the job was cancelled on six of the
  # last eight pushes to main, still inside "Installing system requirements"
  # when the timeout fired. It never reached R CMD check, so those runs were
  # not a devel failure being tolerated -- they were devel never being tested,
  # while the run reported "cancelled" and the platform went unverified.
  #
  # nightly.yaml already runs devel properly, with timeout-minutes 150 for that
  # platform specifically and the same reasoning written out beside it. Paying
  # a two-and-a-half-hour source compile on every push to reproduce a check
  # that runs each night buys nothing, so devel coverage moves there rather
  # than being dropped. If devel is ever wanted here again, the timeout has to
  # come with it.
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      config: ${{ steps.set.outputs.config }}
    steps:
      - id: set
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'config=[{"os":"ubuntu-latest","r":"release"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'config=[{"os":"macos-latest","r":"release"},{"os":"windows-latest","r":"release"},{"os":"ubuntu-latest","r":"release"},{"os":"ubuntu-latest","r":"oldrel-1"}]' >> "$GITHUB_OUTPUT"
          fi

  R-CMD-check:
    needs: matrix
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 60

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.matrix.outputs.config) }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # See nightly.yaml: a dying parallel testthat worker fails R CMD check
      # with an opaque traceback ending in parallel_event_loop_chunky. The suite
      # runs serially wherever R CMD check runs it.
      TESTTHAT_PARALLEL: 'FALSE'

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev \
            libgit2-dev libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libfftw3-dev libtiff5-dev libjpeg-dev libpng-dev qpdf

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          extra-packages: any::rcmdcheck
          cache: true
          needs: check

      - name: Install TinyTeX
        run: |
          install.packages("tinytex")
          tinytex::install_tinytex()
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          args: 'c("--no-manual", "--as-cran", "--run-donttest")'
          # Strict gate: any --as-cran WARNING, not just an ERROR, fails the
          # check on every event.
          #
          # This was previously relaxed to error-only because a standing
          # WARNING would otherwise have blocked all merges. That WARNING was
          # "checking code files for non-ASCII characters", and it is fixed:
          # R CMD check went from 1 WARNING + 6 NOTEs to 6 NOTEs. With nothing
          # left to suppress, the gate can be strict again.
          #
          # If a new WARNING appears and is genuinely benign, fix it or
          # document why rather than relaxing this back -- a gate that has been
          # loosened once tends to stay loose.
          error-on: '"warning"'

