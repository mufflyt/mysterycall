# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

concurrency:
  # A new push to the same branch/PR cancels the in-progress run so checks
  # don't pile up (matters most for the full matrix on main).
  group: R-CMD-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pick the matrix by event: a pull request gets a fast single-platform gate
  # (ubuntu-release); push(main) and manual workflow_dispatch runs get the full
  # cross-platform matrix (macOS, Windows, Linux devel/release/oldrel-1).
  matrix:
    runs-on: ubuntu-latest
    outputs:
      config: ${{ steps.set.outputs.config }}
    steps:
      - id: set
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'config=[{"os":"ubuntu-latest","r":"release"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'config=[{"os":"macos-latest","r":"release"},{"os":"windows-latest","r":"release"},{"os":"ubuntu-latest","r":"devel","http-user-agent":"release"},{"os":"ubuntu-latest","r":"release"},{"os":"ubuntu-latest","r":"oldrel-1"}]' >> "$GITHUB_OUTPUT"
          fi

  R-CMD-check:
    needs: matrix
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.matrix.outputs.config) }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev \
            libgit2-dev libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libfftw3-dev libtiff5-dev libjpeg-dev libpng-dev qpdf

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          cache: true
          needs: check

      - name: Install TinyTeX
        run: |
          install.packages("tinytex")
          tinytex::install_tinytex()
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          args: 'c("--no-manual", "--as-cran", "--run-donttest")'
          # Strict gate: any --as-cran WARNING (or ERROR) fails the check, on
          # every event. Re-tightened after the noisy test warnings that had
          # been surfacing were silenced.
          error-on: '"warning"'

      # TEMPORARY DIAGNOSTIC: the check-r-package "Show testthat output" step
      # floods the job-log tail with the passing test transcript, hiding the
      # check-level Status/WARNING lines from a remote reader. Print just the
      # check structure (case-sensitive WARNING/NOTE are R-CMD-check level, not
      # the lowercase test "Warning" lines) so the specific --as-cran WARNING is
      # readable. Remove once the WARNING is identified and fixed.
      - name: Surface R-CMD-check WARNINGs
        if: always()
        shell: bash
        run: |
          logf=$(find . -name 00check.log 2>/dev/null | head -1)
          echo "=== 00check.log: $logf ==="
          if [ -n "$logf" ]; then
            grep -n -E '^\* checking|WARNING|NOTE|^Status:' "$logf" || echo '(no check-structure lines matched)'
            echo '=== last 30 lines ==='
            tail -30 "$logf"
          else
            echo '(00check.log not found)'
          fi

