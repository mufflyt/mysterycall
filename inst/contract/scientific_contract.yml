experimental_arms:
  status: DERIVED
  value: ["Medicaid", "Blue Cross/Blue Shield"]
  evidence: "tests/fixtures/canonical_study_expected.json -> calls.by_arm"
  release_blocking: true

arm_differences_authorized:
  status: UNRESOLVED
  release_blocking: true
  question: >-
    Section 12: the two scripts must differ ONLY in authorized payer language.
    List every field authorized to differ so the equivalence test can assert it.

script_versions:
  status: UNRESOLVED
  release_blocking: true
  question: >-
    Section 13: approved script version identifiers and their SHA-256s. Every
