# =============================================================================
# mysterycall SCIENTIFIC CONTRACT
# =============================================================================
# The machine-readable estimand. Spec section 3.
#
# Every field carries a `status`:
#
#   DERIVED     The definition is already pinned somewhere in this repository.
#               `evidence` cites the file that pins it. Changing the code
#               without changing this file is a contract violation.
#
#   UNRESOLVED  The code does not pin this, or pins it only as a caller-supplied
#               parameter. `question` states exactly what must be decided. These
#               are STUDY DESIGN decisions and are deliberately left blank:
#               inventing one here would fabricate the study's science, which is
#               the failure this contract exists to prevent.
#
# `release_blocking: true` marks fields that section 103 makes a release gate.
# tools/ci/check_scientific_contract.R fails while any of those is UNRESOLVED.
#
# Changing this file changes the study. The recorded SHA-256 in
# inst/contract/scientific_contract.sha256 must be updated in the same commit,
# which is what forces a contract change to be reviewed as a scientific change
# rather than a refactor.
# =============================================================================

contract_version: "0.1.0"
schema_version: "1.0.0"
status: "DRAFT -- reverse-engineered from code and fixtures; unresolved fields require investigator decisions"

# --- population and frame ----------------------------------------------------
target_provider_population:
  status: PER_STUDY
  value_type: free_text
  release_blocking: true
  why_per_study: >-
    Every study defines its own population; there is no package-level answer.
  format: >-
    Specialty, credential, and any age or practice-type restriction, as the protocol defined it.


target_practice_population:
  status: PER_STUDY
  value_type: free_text
  release_blocking: true
  why_per_study: >-
    Depends entirely on the sampling design of the individual study.
  format: >-
    Practice types in scope, and whether health-system sites are treated separately.


sampling_frame:
  status: PER_STUDY
  value_type: free_text
  release_blocking: true
  why_per_study: >-
    The frame is a study artefact with its own vintage and provenance.
  format: >-
    Name the roster or registry, its vintage, and how it was obtained.


sampling_date:
  status: PER_STUDY
  value_type: free_text
  release_blocking: true
  why_per_study: >-
    A property of when the study was fielded.
  format: >-
    ISO date or range on which the frame was drawn.


inclusion_criteria:
  status: PER_STUDY
  value_type: free_text
  release_blocking: true
  why_per_study: >-
    Protocol-specific, and must be fixed before outcomes are observed.
  format: >-
    The criteria applied BEFORE any outcome was known.


exclusion_criteria_prespecified:
  status: PER_STUDY
  value_type: free_text
  release_blocking: true
  why_per_study: >-
    Protocol-specific; the prespecified/post-hoc distinction is what makes it reviewable.
  format: >-
    Exclusions declared in advance, distinguished from those added later.


# --- units -------------------------------------------------------------------
# Section 6 treats confusion between these as a primary failure mode.
unit_of_sampling:
  status: PER_STUDY
  value_type: enumerated
  release_blocking: true
  why_per_study: >-
    Section 6. Which entity was drawn from the frame. A study sampling practices and one sampling physicians produce different denominators from identical calls.
  allowed_values:
    - physician
    - practice
    - practice_location
    - phone_number


unit_of_calling:
  status: DERIVED
  value: "call"
  evidence: "tests/fixtures/canonical_study_expected.json -> calls._comment"
  detail: >-
    One row per call. A provider with two office locations contributes a call
    per location per arm: the fixture's P04 yields four calls.
  release_blocking: true

unit_of_analysis:
  status: PER_STUDY
  value_type: enumerated
  release_blocking: true
  why_per_study: >-
    Section 6. The row the primary estimate treats as one observation. Confusing this with the call count is the single most common way a denominator inflates.
  allowed_values:
    - call
    - physician
    - practice
    - matched_pair


randomization_unit:
  status: PER_STUDY
  value_type: enumerated
  release_blocking: true
  why_per_study: >-
    Section 10. What the arm was assigned to. If assignment was per physician the design is paired; if per call it is not, and the same data supports different analyses.
  allowed_values:
    - physician
    - practice
    - call
    - not_randomized


clustering_unit:
  status: PER_STUDY
  release_blocking: true
  why_per_study: >-
    Section 41. The correct grouping is a fact about the design, not a modelling
    preference. If the same physician received both arms, the physician is the
    randomisation unit and clustering on state understates the correlation that
    pairing induces. If several sampled physicians share one scheduling line,
    the practice is the dependence unit regardless of how randomisation worked.
  allowed_values:
    - physician
    - practice
    - matched_pair
    - state
    - none_independent_calls
  observed_in_code: >-
    R/auto_model.R takes the grouping column as a caller-supplied
    `random_intercept`. Repository-wide, (1 | state) is the most common formula
    term, with (1 | physician) and Matched_Pair_ID also present. Three different
    designs are therefore expressible, and the code does not choose between them.
  consequence_if_wrong: >-
    Clustering on the wrong unit changes the standard error but not the point
    estimate, so the effect looks unchanged while its confidence interval and
    p-value are wrong. Nothing in the output announces this.


# --- arms and scripts --------------------------------------------------------
experimental_arms:
  status: DERIVED
  value: ["Medicaid", "Blue Cross/Blue Shield"]
  evidence: "tests/fixtures/canonical_study_expected.json -> calls.by_arm"
  release_blocking: true

arm_differences_authorized:
  status: PER_STUDY
  value_type: free_text
  release_blocking: true
  why_per_study: >-
    Depends on what the two scripts actually say, which lives with the protocol, not the package.
  format: >-
    The exact fields permitted to differ between arm scripts. Everything else differing is confounding built into the protocol.


script_versions:
  status: PER_STUDY
  value_type: free_text
  release_blocking: true
  why_per_study: >-
    Scripts are study documents and are not in this repository at all, so this cannot be derived here.
  format: >-
    Version identifier and SHA-256 for each arm script, so a call can name the script it was conducted under.


# --- outcomes ----------------------------------------------------------------
primary_outcome:
  status: DERIVED
  value: "business_days_until_appointment"
  evidence: "R/business_days.R:3-6; tests/fixtures/canonical_study_expected.json -> wait_times._comment"
  detail: "The fixture states plainly that business days are primary and calendar days the sensitivity comparator."
  release_blocking: true

wait_time_definition:
  status: DERIVED
  value: "Mon-Fri working days, excluding US federal holidays, between the call date and the offered appointment date"
  evidence: "R/business_days.R:4-6"
  release_blocking: true

business_or_calendar_day_convention:
  status: DERIVED
  value: "business days primary; calendar days retained as sensitivity comparator"
  evidence: "tests/fixtures/canonical_study_expected.json -> wait_times (both frozen, to catch a silent swap)"
  release_blocking: true

wait_time_endpoint_inclusivity:
  status: UNRESOLVED
  release_blocking: true
  partially_derived:
    evidence: "tests/testthat/test-scientific-wait-time-reference.R -- verified against 400 random date pairs"
    observed_rule: "wait = max(0, business days in the CLOSED interval [call, appt] - 1)"
    detail: >-
      Reverse-engineered, not documented: R/business_days.R says only "between
      the call date and the offered appointment date", which does not
      distinguish the candidate conventions. bizdays adjusts the start forward
      and the end backward onto business days before counting, which is what the
      identity above captures. The conventions agree whenever BOTH endpoints are
      working days, so the ambiguity is invisible in ordinary data and only
      appears when a call or appointment lands on a weekend or holiday.
    consequence: >-
      A SATURDAY call seen the following Monday scores 0 business days --
      identical to a same-day appointment. If weekend call dates occur in the
      real study, those waits are undercounted.
    consequence_verified: >-
      Confirmed directly against the package, not inferred:
        Sat 2026-03-07 -> Mon 2026-03-09 = 0
        Sun 2026-03-08 -> Mon 2026-03-09 = 0
        Mon 2026-03-09 -> Mon 2026-03-09 = 0   (a real same-day appointment)
        Fri 2026-03-06 -> Mon 2026-03-09 = 1
      A weekend-logged call and immediate access are therefore the same number.
      Whether that is acceptable depends on whether weekend call dates exist in
      the study, which the call log can answer directly.
  question: >-
    Ratify or change the observed rule. Specifically: should a call logged on a
    non-working day count the wait from the call date, or from the next working
    day? Section 76 requires weekend/invalid call dates to be tested for, so the
    case is reachable rather than hypothetical.

holiday_calendar_version:
  status: DERIVED
  value: >-
    bizdays calendar "USFederal": all 11 US federal holidays; weekends are
    Saturday and Sunday; fixed-date holidays shift to their observed weekday
    (Friday if Saturday, Monday if Sunday); floating holidays (MLK, Presidents,
    Memorial, Labor, Columbus, Thanksgiving) computed exactly. The year range is
    a parameter of the calendar builder, not a constant.
  evidence: >-
    R/business_days.R -- bizdays::create.calendar(name = "USFederal",
    weekdays = c("saturday","sunday")) and the observed-weekday shift documented
    at R/business_days.R:55-74.
  residual_risk: >-
    The year range is still supplied by the caller. Pinning it is what makes a
    calendar change reviewable rather than silent; until it is pinned, two runs
    over different ranges can disagree without either being wrong.
  release_blocking: false

appointment_definition:
  status: PER_STUDY
  release_blocking: true
  why_per_study: >-
    Section 26. A protocol that measures the soonest access a patient could
    obtain freezes the EARLIEST OFFERED slot. A protocol measuring what a
    patient actually received freezes the BOOKED one. Both are defensible and
    they differ whenever a caller declines the first offer, so a single global
    answer would be wrong for every study that chose the other.
  allowed_values:
    - earliest_offered
    - appointment_chosen_by_caller
    - appointment_booked
  recommended: earliest_offered
  recommendation_basis: >-
    An access study asks how soon care was available, not which slot the caller
    preferred. Booked date is also the easier field to identify, which is
    exactly why it gets substituted by accident.
  consequence_if_wrong: >-
    Substituting booked for earliest offered inflates every wait by the caller's
    own scheduling preference, and does so asymmetrically if callers behaved
    differently across arms.


secondary_outcomes:
  status: DERIVED
  value: >-
    Appointment acceptance rate (mysterycall_acceptance_rate,
    mysterycall_insurance_acceptance_rates); wait-time distribution summaries
    (mysterycall_wait_time_summary, _by_group, _crossover, _sentence); and the
    calendar-day wait retained as the sensitivity comparator to the business-day
    primary.
  evidence: >-
    Exported functions in R/; calendar-day comparator frozen in
    tests/fixtures/canonical_study_expected.json -> wait_times.calendar_days.
  constraint: >-
    Section 68: these are computed alongside the primary endpoint and must never
    overwrite it. The business-day wait is primary; the calendar-day wait is a
    comparator and is frozen separately precisely so a silent swap fails.
  release_blocking: false

# --- acceptance and status semantics ----------------------------------------
payer_acceptance_definition:
  status: PER_STUDY
  release_blocking: true
  why_per_study: >-
    Section 15. "Our office accepts Medicaid" and "Dr. X accepts Medicaid" are
    different claims, and which one a study measures depends on whether the
    sampling unit was the practice or the named physician. Collapsing them into
    one binary is only legitimate if the protocol says so explicitly.
  allowed_values:
    - named_physician_accepts
    - practice_accepts
    - either_counts_as_acceptance
    - named_physician_with_referral_counts
  recommended: named_physician_accepts
  recommendation_basis: >-
    The roster samples physicians, and the call asks for a named physician, so
    the practice-level answer measures a different population than the one
    sampled.
  consequence_if_wrong: >-
    Counting practice acceptance as physician acceptance overstates access
    wherever a practice takes the payer but the sampled physician does not,
    which is precisely the case an access study exists to detect.


named_vs_alternate_provider:
  status: PER_STUDY
  value_type: enumerated
  release_blocking: true
  why_per_study: >-
    Section 16. Whether a partner or APP appointment counts as access to the sampled physician. These measure different things and both are legitimate study designs.
  allowed_values:
    - named_physician_only
    - named_or_partner
    - named_or_any_clinician_including_app


provider_active_definition:
  status: PER_STUDY
  value_type: enumerated
  release_blocking: true
  why_per_study: >-
    Sections 17-19. What evidence establishes that the sampled physician still practises where the roster said. Studies differ in what they can obtain.
  allowed_values:
    - office_confirms_at_listed_location
    - office_confirms_anywhere_in_system
    - any_directory_evidence
    - scheduling_confirms_only


listed_location_definition:
  status: PER_STUDY
  value_type: enumerated
  release_blocking: true
  why_per_study: >-
    Section 17. How closely the reached office must match the listed one. "Not confirmed at the listed location" must never default to "inactive provider".
  allowed_values:
    - exact_listed_address
    - same_practice_any_site
    - same_health_system
    - same_city


# --- protocol ----------------------------------------------------------------
call_attempt_policy:
  status: PER_STUDY
  value_type: free_text
  release_blocking: true
  why_per_study: >-
    Attempt budgets are a protocol decision and differ widely between studies.
  format: >-
    Maximum attempts, minimum separation, and permitted hours. Must be symmetric across arms or effort becomes a second treatment.


callback_policy:
  status: PER_STUDY
  value_type: free_text
  release_blocking: true
  why_per_study: >-
    Where the clock starts is a definitional choice each protocol makes.
  format: >-
    Whether the access clock starts at first attempt, first contact, callback, or scheduling decision.


voicemail_policy:
  status: PER_STUDY
  value_type: enumerated
  release_blocking: true
  why_per_study: >-
    Section 23. Whether reaching voicemail spends one of the permitted attempts. This changes effective attempt intensity, which must be symmetric across arms.
  allowed_values:
    - voicemail_consumes_an_attempt
    - voicemail_does_not_consume_an_attempt
    - voicemail_ends_the_protocol


# --- denominators, missingness, exclusions ----------------------------------
exclusion_vocabulary:
  status: DERIVED
  value:
    - "Able to contact"
    - "Unable to contact office"
    - "Wrong number"
    - "Physician retired"
    - "Physician moved practices"
  evidence: "tests/fixtures/canonical_study_expected.json -> exclusions.allowed_vocabulary"
  detail: "Closed vocabulary. Every excluded row carries a reason; no row is excluded blank."
  release_blocking: true

denominator_rules:
  status: DERIVED
  value:
    acceptance_analytic_n: 23
    wait_time_analytic_n: 20
    reconciliation: "contactable + excluded == total calls"
  evidence: "tests/fixtures/canonical_study_expected.json -> denominators, invariants"
  detail: >-
    Frozen against the canonical fixture only. Section 44 additionally requires
    every reported percentage to carry its numerator, denominator and
    denominator definition.
  release_blocking: true

missingness_states:
  status: DERIVED
  value: "appointment_offered is three-valued: TRUE / FALSE / NA"
  evidence: "tests/fixtures/canonical_study_expected.json -> outcomes._comment"
  detail: >-
    NA means reached but unresolved and must NEVER silently become FALSE.
    Section 28 additionally requires wait = 0 (same-day) to stay distinct from
    missing, refusal, unreachable and not-accepted.
  release_blocking: true

analysis_population:
  status: PER_STUDY
  value_type: enumerated
  release_blocking: true
  why_per_study: >-
    Section 67. Which rows the primary estimate runs on. Numerator and denominator drawn from different populations is a silent error, so the population is named once and reused.
  allowed_values:
    - intention_to_call
    - successfully_contacted
    - provider_confirmed
    - payer_evaluable
    - appointment_evaluable
    - paired_complete


# --- inference ---------------------------------------------------------------
model_family:
  status: DERIVED
  value: "Poisson or negative binomial, selected by overdispersion"
  evidence: "R/auto_model.R:48-50 -- poisson_phi, model_chosen"
  release_blocking: false

confidence_interval_method:
  status: DERIVED
  value: >-
    Wald (stats::confint.default) on the log scale, exponentiated to the rate-
    ratio / odds-ratio scale.
  evidence: >-
    R/insurance_wait_sentence.R:137 uses stats::confint.default on the primary
    wait-time path. R/simple_poisson.R uses profile-likelihood stats::confint()
    with an option to disable it for speed.
  resolves_inconsistency: >-
    These two are not the same interval. Until now the reported CI depended on
    which function the caller happened to use, which is a defect independent of
    this contract: the same data could yield two different published intervals.
    Wald is recorded as the standard because it is what the primary path
    already uses and because section 43 requires an independent reference to
    reproduce it, which is straightforward for Wald and awkward for profile
    likelihood.
  required_followup: >-
    R/simple_poisson.R should be brought onto the same convention, or the
    contract amended to say which endpoints legitimately use profile intervals.
    Leaving both in place means the contract is describing two studies.
  release_blocking: true

weighting_rules:
  status: DERIVED
  value: "Unweighted. No sampling or post-stratification weight is applied anywhere."
  evidence: >-
    Repository-wide search finds no `weights =` argument on any model call, no
    use of the survey package, and no svydesign object in R/. Every estimate is
    an unweighted function of the analytic rows.
  release_blocking: false

sensitivity_analyses:
  status: DERIVED
  release_blocking: false
  partially_derived:
    evidence: "tests/fixtures/canonical_study_expected.json -> wait_times.calendar_days"
    detail: "Calendar-day recomputation is already frozen as a comparator."
  value: >-
    Calendar-day versus business-day wait; both-insurance sensitivity
    (R/sensitivity_both_insurance.R); the general sensitivity table
    (R/sensitivity.R, R/sensitivity_table.R); and calendar sensitivity
    (R/calendar_sensitivity.R).
  evidence: "R/sensitivity.R, R/sensitivity_both_insurance.R, R/sensitivity_table.R, R/calendar_sensitivity.R"
  status_note: >-
    Derived from the sensitivity machinery that exists, which is not the same as
    a prespecified set. If the protocol declared sensitivities that are not in
    this list, the list is wrong rather than the protocol.

