# =============================================================================
# mysterycall SCIENTIFIC CONTRACT
# =============================================================================
# The machine-readable estimand. Spec section 3.
#
# Every field carries a `status`:
#
#   DERIVED     The definition is already pinned somewhere in this repository.
#               `evidence` cites the file that pins it. Changing the code
#               without changing this file is a contract violation.
#
#   UNRESOLVED  The code does not pin this, or pins it only as a caller-supplied
#               parameter. `question` states exactly what must be decided. These
#               are STUDY DESIGN decisions and are deliberately left blank:
#               inventing one here would fabricate the study's science, which is
#               the failure this contract exists to prevent.
#
# `release_blocking: true` marks fields that section 103 makes a release gate.
# tools/ci/check_scientific_contract.R fails while any of those is UNRESOLVED.
#
# Changing this file changes the study. The recorded SHA-256 in
# inst/contract/scientific_contract.sha256 must be updated in the same commit,
# which is what forces a contract change to be reviewed as a scientific change
# rather than a refactor.
# =============================================================================

contract_version: "0.1.0"
schema_version: "1.0.0"
status: "DRAFT -- reverse-engineered from code and fixtures; unresolved fields require investigator decisions"

# --- population and frame ----------------------------------------------------
target_provider_population:
  status: UNRESOLVED
  release_blocking: true
  question: >-
    Which physicians is this study making a claim about? State specialty,
    credential, and any board-certification requirement.

target_practice_population:
  status: UNRESOLVED
  release_blocking: false
  question: Which practices/sites are in scope, and are solo and group practices treated alike?

sampling_frame:
  status: UNRESOLVED
  release_blocking: true
  question: >-
    Which roster, which snapshot, and which version defines the universe from
    which providers were sampled?

sampling_date:
  status: UNRESOLVED
  release_blocking: true
  question: Date the frame was drawn. Section 97 requires source dates be explicit, not implicit.

inclusion_criteria:
  status: UNRESOLVED
  release_blocking: true
  question: Eligibility evaluated BEFORE any outcome is known. Distinct from the post-call exclusion reasons below.

exclusion_criteria_prespecified:
  status: UNRESOLVED
  release_blocking: true
  question: >-
    Which exclusions were prespecified rather than decided after seeing data?
    Section 85 requires each exclusion record whether it was prespecified.

# --- units -------------------------------------------------------------------
# Section 6 treats confusion between these as a primary failure mode.
unit_of_sampling:
  status: UNRESOLVED
  release_blocking: true
  question: Is a sampled unit the physician, the practice, or the practice-location?

unit_of_calling:
  status: DERIVED
  value: "call"
  evidence: "tests/fixtures/canonical_study_expected.json -> calls._comment"
  detail: >-
    One row per call. A provider with two office locations contributes a call
    per location per arm: the fixture's P04 yields four calls.
  release_blocking: true

unit_of_analysis:
  status: UNRESOLVED
  release_blocking: true
  question: >-
    Call, provider, or practice? The fixture freezes call-level denominators
    (acceptance_analytic_n = 23 rows), but that does not by itself establish
    that inference is at the call level. Section 41 makes this a release gate.

randomization_unit:
  status: UNRESOLVED
  release_blocking: true
  question: >-
    What was randomized -- provider, practice, or call? The fixture shows P14
    receiving a Medicaid arm only, so the design is not strictly paired-by-provider.

clustering_unit:
  status: UNRESOLVED
  release_blocking: true
  partially_derived:
    evidence: "R/auto_model.R:31-32 -- `random_intercept`, 'Grouping column for the physician random intercept'"
    detail: >-
      The model takes the grouping column as a CALLER-SUPPLIED parameter; it is
      not fixed in code. Repository-wide the most common formula term is
      (1 | state), with (1 | physician) and Matched_Pair_ID also present.
  question: >-
    Which grouping variable does the PRIMARY analysis cluster on? A parameter
    with several values in use is not a contract.
  recommendation: >-
    Not decidable from code: (1 | state), (1 | physician) and Matched_Pair_ID
    are all present, and they encode three different designs. If the same
    physician received both arms, the randomisation unit is the physician and
    clustering on state would understate the correlation that pairing induces.
    This is a design fact, not a modelling preference, so it is left for the
    investigator.

