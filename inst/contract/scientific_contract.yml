# Section 81: exact statistics may move within tolerance; these may not.
frozen_directions:
  status: DERIVED
  value:
    medicaid_wait_longer: true
    medicaid_acceptance_lower: true
    calendar_ge_business_every_row: true
  evidence: "tests/fixtures/canonical_study_expected.json -> directions"
